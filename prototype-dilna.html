<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just Throw It · Workshop prototype</title>
<!-- Maketa Dílny, kolo 2 (vlaštovky za mince s dvojím klíčem, klepnutí = do ruky, Vzhled = potisk + razítko, čip Sail při míření).
     Spec: research/obsah/02-ux-dilna.md. Falešná data, nesahá do src/. -->
<style>
:root{
 /* 1 primitivní (bible 05-styl-papir kap. 2.1) */
 --paper-0:#ffffff;--cream-50:#fbf6ec;--card-100:#f4ecdc;--graphite-900:#2a2622;--pencil-500:#6b6158;--pencil-700:#4a4038;
 --desk-300:#d9c4a0;--tape-200:#efe0a8;--tomato-500:#d9472b;--tomato-600:#c43f25;--tomato-700:#a8341e;--teal-600:#13807d;
 --mustard-400:#e2a43a;--mustard-800:#8a5a00;--cobalt-600:#2456c9;
 /* 2 role */
 --ink:var(--graphite-900);--text:var(--graphite-900);--dim:var(--pencil-500);--dim-on-desk:var(--pencil-700);
 --card:var(--cream-50);--card-2:var(--card-100);--desk:var(--desk-300);--tape:var(--tape-200);
 --color-reward:var(--mustard-400);--color-reward-text:var(--mustard-800);--color-success:var(--teal-600);
 --color-new:var(--tape-200);--color-locked:var(--pencil-500);--focus:var(--cobalt-600);
 --display:"Trebuchet MS","Segoe UI Semibold","Avenir Next",sans-serif;--body:"Segoe UI","Avenir Next",system-ui,sans-serif;
 --lift:0 2px 0 rgb(40 25 10/.12),0 6px 14px rgb(59 53 96/.18);--lift-hi:0 3px 0 rgb(40 25 10/.14),0 10px 22px rgb(59 53 96/.24);
 --r:4px;--t-fast:120ms;--t-mid:240ms;
 /* 3 komponenty */
 --btn-primary-bg:var(--tomato-600);--btn-primary-fg:var(--cream-50);--btn-primary-edge:var(--tomato-700);
 --btn-bg:var(--cream-50);--btn-fg:var(--ink);--btn-edge:#cbbfa8;--btn-disabled-bg:#e9e1d1;--btn-disabled-fg:#6b6158;
 --wk-card-w:120px;--wk-card-h:132px;--wk-card-bg:var(--card);--wk-card-held-border:3px solid var(--ink);--wk-card-picked-border:2px dashed var(--ink);
 --wk-sketch-stroke:var(--color-locked);--wk-tag-new-bg:var(--color-new);--wk-tag-new-fg:var(--ink);--wk-tag-hand-bg:var(--tape);--wk-price-fg:var(--color-reward-text);
 --wk-stat-fill:var(--ink);--wk-stat-track:var(--desk);--wk-path-now:var(--dim);--wk-path-new:var(--ink);--wk-tab-mark:var(--tape);
 --wk-preview-h:clamp(140px,30dvh,260px);--wk-action-h:56px;
 --aim-chip-bg:var(--card);--aim-chip-edge:var(--ink);
}
@media (max-width:340px){:root{--wk-card-w:104px;--wk-card-h:124px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--text);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:var(--color-reward);border:2px solid var(--ink);vertical-align:-.1em;margin-left:.2em}
[hidden]{display:none!important}

/* panel Dílny */
.wk{display:flex;flex-direction:column;height:100dvh;background:var(--card);max-width:100%}
.wk-head{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));border-bottom:1px solid var(--btn-edge)}
.wk-head h1{flex:1;margin:0;font:700 clamp(20px,5vw,26px)/1.1 var(--display)}
.wallet{font:700 18px var(--display);white-space:nowrap}
.icon{min-width:44px;min-height:44px;border:2px solid var(--btn-edge);border-radius:var(--r);background:var(--btn-bg);cursor:pointer}
.wk-body{flex:1;display:flex;flex-direction:column;min-height:0}
.preview{position:relative;height:var(--wk-preview-h);flex:none;background:linear-gradient(#a6d0e8,#d8e9ea 60%,#fce4c6);overflow:hidden}
.preview svg{width:100%;height:100%;display:block}
.pv-cap{position:absolute;left:12px;bottom:8px;background:var(--card);padding:2px 8px;border-radius:var(--r);font:600 14px var(--display);box-shadow:var(--lift);transform:rotate(-1.5deg);max-width:calc(100% - 24px)}
.pv-only{position:absolute;right:12px;top:8px;background:var(--tape);padding:2px 8px;border-radius:2px;font:700 13px var(--display);transform:rotate(2deg)}
.preview .chip{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream-50);padding:4px 10px;border-radius:var(--r);font-size:14px}
.preview.lost svg .pv-plane{opacity:.35}
.pv-plane{transform-origin:50% 50%;transform-box:fill-box}
.refold .pv-plane{animation:refold 750ms ease-out}
.refold-quick .pv-plane{animation:refold 300ms ease-out}
@keyframes refold{0%{transform:scale(1)}35%{transform:scale(.2,1) rotate(-8deg);opacity:.6}100%{transform:scale(1);opacity:1}}
.wk-main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--btn-edge);flex:none}
.tab{flex:1;min-height:48px;border:0;background:none;color:var(--dim);font:600 16px var(--display);cursor:pointer;position:relative;padding:0 6px}
.tab[aria-selected=true]{color:var(--text);font-weight:700}
.tab[aria-selected=true]::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:4px;background:var(--wk-tab-mark);border-top:1px solid #c9b46a}
@media (pointer:fine){.tab:hover{color:var(--text)}}
.tag-new{display:inline-block;background:var(--wk-tag-new-bg);color:var(--wk-tag-new-fg);font:700 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:2px;transform:rotate(-2deg);box-shadow:0 1px 0 rgb(40 25 10/.15);margin-left:4px;vertical-align:2px}
.panel{flex:1;overflow-y:auto;padding:12px 16px 16px;scroll-padding-bottom:calc(var(--wk-action-h) + 16px)}
.panel.enter{animation:enter 200ms ease-out}
@keyframes enter{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.note{font-size:14px;color:var(--dim-on-desk);margin:4px 0 12px}
h3.sec{font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim-on-desk);margin:12px 0 6px}

/* karty */
.cards{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 16px 10px;margin:0 -16px;list-style:none;overscroll-behavior-x:contain}
.cards li{flex:none;scroll-snap-align:start}
.card{position:relative;width:var(--wk-card-w);height:var(--wk-card-h);border:2px solid transparent;border-radius:var(--r);background:var(--wk-card-bg);box-shadow:var(--lift);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 6px 8px;cursor:pointer;transition:transform var(--t-fast) ease-out,box-shadow var(--t-fast) ease-out;text-align:center}
.card svg{width:100%;height:58px}
.card .nm{font:700 15px/1.15 var(--display);overflow-wrap:anywhere}
.card .st{font-size:13px;color:var(--dim-on-desk);line-height:1.2;display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.card .price{color:var(--wk-price-fg);font:700 14px var(--display)}
@media (pointer:fine){.card:hover{box-shadow:var(--lift-hi);transform:translateY(-2px)}}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 rgb(40 25 10/.2)}
.card.inspect{border:var(--wk-card-picked-border)}
.card.held{border:var(--wk-card-held-border)}
.card.hidden-m .nm{color:var(--dim)}
.tag-hand{position:absolute;top:-10px;left:50%;translate:-50% 0;background:var(--wk-tag-hand-bg);color:var(--ink);font:700 12px/1 var(--display);padding:4px 6px;border-radius:2px;transform:rotate(-2deg);box-shadow:0 1px 0 rgb(40 25 10/.18);white-space:nowrap}
.tag-hand.drop{animation:tagdrop 150ms ease-out}
@keyframes tagdrop{from{transform:scale(.9) rotate(-6deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 8px;list-style:none;padding:8px 0 0;margin:0 0 8px}
.swatches .card{width:100%;height:auto;min-height:92px}
.swatches .card svg{height:46px}
.swatches .card .nm{font-size:13px}
.swatches.stamps{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.swatches.stamps .card{min-height:76px}
.swatches.stamps .card svg{height:30px}

/* detail */
.detail h2{font:700 clamp(20px,5vw,24px)/1.15 var(--display);margin:8px 0 2px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.detail h2 .price{color:var(--wk-price-fg);font-size:18px}
.detail h2 .hand{font:600 15px var(--display)}
.detail p{margin:4px 0}
.loves{font-weight:600}
.why{font-size:14px;color:var(--text);font-weight:600;margin:0}
.stats{display:grid;grid-template-columns:minmax(96px,auto) 1fr auto;gap:6px 10px;align-items:center;margin:10px 0;font-size:15px}
.bar{height:10px;background:var(--wk-stat-track);border-radius:2px;position:relative;overflow:hidden;min-width:60px}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--wk-stat-fill);transform-origin:left;transition:transform var(--t-mid) ease-out}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tomato-600)}
.delta{font:700 14px var(--display);white-space:nowrap}
.chart{width:100%;height:96px;display:block;background:var(--card-2);border-radius:var(--r);margin:6px 0 2px}
.legend{font-size:13px;color:var(--dim-on-desk);display:flex;gap:12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:22px;height:0;border-top:2px dashed var(--wk-path-now);vertical-align:middle;margin-right:4px}
.legend span.new::before{border-top:3px solid var(--wk-path-new)}
.est{font:700 17px var(--display);margin-top:8px}
.locked-how{background:var(--card-2);padding:8px 10px;border-radius:var(--r);margin:8px 0;display:flex;gap:6px;align-items:flex-start}
.retro{background:var(--tape);padding:8px 10px;border-radius:var(--r);margin:0 0 12px;transform:rotate(-.5deg)}
.layers{background:var(--card-2);border-radius:var(--r);padding:8px 10px;margin:0 0 4px;font-size:14px}
.layers strong{display:block;font:700 14px var(--display);margin-bottom:2px}
.layers ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.linkish{background:none;border:0;padding:0 2px;min-height:44px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.layers li{min-height:24px;display:flex;align-items:center}

/* stub stromu */
.branch{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.branch strong{min-width:84px;font-family:var(--display)}
.node{min-width:48px;min-height:48px;border:2px solid var(--btn-edge);border-radius:var(--r);background:var(--card);font:700 14px var(--display);display:inline-grid;place-items:center}
.node.own{background:var(--ink);color:var(--cream-50)}

/* pás akce */
.action{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 16px;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--btn-edge);background:var(--card)}
.btn{min-height:48px;border-radius:var(--r);border:2px solid var(--btn-edge);border-bottom-width:4px;background:var(--btn-bg);color:var(--btn-fg);font:700 17px var(--display);padding:0 16px;cursor:pointer;transition:transform var(--t-fast) ease-out}
.btn.primary{min-height:56px;background:var(--btn-primary-bg);color:var(--btn-primary-fg);border-color:var(--btn-primary-edge)}
@media (pointer:fine){.btn.primary:hover{background:var(--tomato-500)}.btn:not(.primary):hover{background:#fff}}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn[aria-disabled=true]{background:var(--btn-disabled-bg);color:var(--btn-disabled-fg);border-color:#d6ccb8;border-bottom-width:2px;cursor:not-allowed;transform:none}
.row{display:flex;gap:8px}.row .btn{flex:1}

/* dialogy */
dialog{border:0;border-radius:var(--r);background:var(--card);color:var(--text);box-shadow:var(--lift-hi);padding:20px 16px 16px;width:min(100% - 24px,420px);position:relative}
dialog::backdrop{background:rgb(42 38 34/.45)}
dialog[open]{animation:sheet 280ms ease-out}
@keyframes sheet{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
dialog::before{content:"";position:absolute;top:-8px;left:50%;width:84px;height:18px;margin-left:-42px;background:var(--tape);opacity:.85;transform:rotate(-2deg)}
dialog h2{font:700 22px/1.2 var(--display);margin:0 0 8px}
dialog p{margin:4px 0}
dialog .err{display:flex;gap:6px;background:#f7e1da;color:var(--text);padding:8px;border-radius:var(--r);margin:8px 0;font-size:15px}
dialog .stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.res-dist{font:700 clamp(36px,10vw,52px)/1 var(--display)}
.news{display:flex;align-items:center;gap:10px;border-left:4px solid var(--ink);padding:6px 0 6px 10px;margin:12px 0 4px;flex-wrap:wrap}
.news.drop{animation:drop 250ms ease-out}
@keyframes drop{from{transform:scale(.96) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.news svg{width:40px;height:40px;flex:none}
.news .t{flex:1 1 140px;font:700 16px/1.2 var(--display);background:none;border:0;text-align:left;padding:0;cursor:pointer;min-height:44px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.news .btn{min-height:44px;font-size:15px}

/* obrazovka míření (§8) */
.aim{position:fixed;inset:0;background:linear-gradient(#9fcbe6,#d7eaee 55%,#f6dfbf 80%,#d9c4a0 80%);overflow:hidden;z-index:5}
.aim-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
.aim-goal{display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:min(100% - 120px,340px)}
.hud-card{background:var(--card);border-radius:var(--r);box-shadow:var(--lift);padding:6px 10px;font:700 15px/1.25 var(--display)}
.hud-card small{display:block;font:600 13px var(--body);color:var(--dim-on-desk)}
.aim-right{display:flex;gap:8px;align-items:center}
.sail-chip{display:flex;align-items:center;gap:8px;min-height:44px;max-width:min(100vw - 24px,320px);background:var(--aim-chip-bg);border:2px solid var(--aim-chip-edge);border-radius:var(--r);box-shadow:var(--lift);padding:4px 10px 4px 6px;text-align:left;cursor:pointer;transition:opacity 200ms ease-out,transform var(--t-fast) ease-out}
.sail-chip svg{width:40px;height:28px;flex:none}
.sail-chip b{display:block;font:700 16px/1.15 var(--display)}
.sail-chip span.g{display:block;font:600 14px/1.2 var(--body)}
@media (pointer:fine){.sail-chip:hover{box-shadow:var(--lift-hi)}}
.sail-chip:active{transform:translateY(2px)}
.aim-kid{position:absolute;left:8%;bottom:14%;width:min(46vw,260px)}
.aim-touch{position:absolute;bottom:12px;padding:10px 12px;border:2px dashed rgb(42 38 34/.35);border-radius:var(--r);font-size:13px;color:var(--pencil-700);background:rgb(251 246 236/.6)}
.aim-touch.l{left:12px}.aim-touch.r{right:12px}
.aim-hint{position:absolute;left:50%;top:46%;translate:-50% 0;font:600 15px var(--display);color:var(--pencil-700);text-align:center;max-width:80vw}

/* panel makety */
.proto{position:fixed;left:8px;bottom:8px;z-index:50;background:#fff;border:2px dashed var(--ink);border-radius:var(--r);font:13px/1.3 system-ui;max-width:calc(100vw - 16px)}
.proto summary{cursor:pointer;padding:8px 10px;min-height:32px}
.proto .pbody{padding:0 10px 10px;display:grid;gap:6px;max-height:60dvh;overflow:auto}
.proto label{display:flex;gap:6px;align-items:center;justify-content:space-between}
.proto select,.proto button{font:inherit;min-height:32px}

/* desktop */
@media (min-width:1024px) and (min-height:600px){
 body{display:grid;place-items:center;padding:24px}
 .wk{height:min(780px,calc(100dvh - 48px));width:min(1080px,100%);border-radius:var(--r);box-shadow:var(--lift-hi);overflow:hidden}
 .wk-body{flex-direction:row}
 .preview{height:auto;width:40%}
 .cards{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible;margin:0;padding:12px 0 10px}
 .cards .card{width:100%}
 .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
 .action{flex-direction:row;align-items:center;flex-wrap:wrap}.action .why{flex-basis:100%}
 .action .btn{flex:1}
}
@media (max-height:500px) and (orientation:landscape){
 .wk-body{flex-direction:row}
 .preview{height:auto;width:35%}
}
@media (max-height:640px) and (orientation:portrait){:root{--wk-preview-h:22dvh}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
[data-motion=reduce] *,[data-motion=reduce] *::before,[data-motion=reduce] *::after{animation-duration:1ms!important;transition-duration:1ms!important}
@media (forced-colors:active){.card.inspect,.card.held{outline:2px solid CanvasText}.tag-new,.tag-hand{border:1px solid CanvasText}}
</style>
</head>
<body>
<section class="wk" id="wk" aria-labelledby="wk-title">
 <header class="wk-head">
  <button class="icon" id="close" type="button"><span aria-hidden="true">✕</span><span class="sr" data-k="workshop.back"></span></button>
  <h1 id="wk-title" data-k="workshop.title"></h1>
  <span class="wallet num" id="wallet"></span>
 </header>
 <div class="wk-body">
  <div class="preview" id="preview" aria-hidden="true"><svg id="pv" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet"></svg><span class="pv-cap" id="pv-cap"></span><span class="pv-only" id="pv-only" hidden></span></div>
  <div class="wk-main">
   <div class="tabs" role="tablist" id="tabs"></div>
   <div class="panel" id="panel" tabindex="0"></div>
   <div class="action" id="action"></div>
  </div>
 </div>
</section>

<section class="aim" id="aim" hidden aria-labelledby="aim-title">
 <h1 class="sr" id="aim-title">Aim</h1>
 <div class="aim-top">
  <div class="aim-goal">
   <div class="hud-card num" id="aim-next"></div>
   <div class="hud-card" id="aim-wind"></div>
   <div id="aim-chip-slot"></div>
  </div>
  <div class="aim-right"><span class="hud-card wallet num" id="aim-coins"></span><button class="icon" type="button" id="aim-pause"><span aria-hidden="true">II</span><span class="sr" data-k="aim.pause"></span></button></div>
 </div>
 <svg class="aim-kid" id="aim-kid" viewBox="0 0 320 180" aria-hidden="true"></svg>
 <p class="aim-hint" id="aim-hint" aria-hidden="true"></p>
 <span class="aim-touch l" aria-hidden="true" data-k="aim.touch"></span><span class="aim-touch r" aria-hidden="true" data-k="aim.touch"></span>
</section>

<dialog id="buy" aria-labelledby="buy-title">
 <h2 id="buy-title"></h2>
 <p class="num" id="buy-coins"></p>
 <p id="buy-hand"></p>
 <div id="buy-err" role="alert"></div>
 <div class="stack">
  <button class="btn primary" id="buy-ok" type="button"></button>
  <button class="btn" id="buy-no" type="button" autofocus></button>
 </div>
</dialog>

<dialog id="result" aria-labelledby="res-title">
 <h2 id="res-title" data-k="result.titleRecord"></h2>
 <div class="res-dist num" id="res-dist"></div>
 <p class="num" id="res-coins"></p>
 <div id="res-news"></div>
 <div class="stack">
  <button class="btn primary" id="res-again" type="button" autofocus data-k="result.again"></button>
  <div class="row"><button class="btn" id="res-wk" type="button" data-k="workshop.title"></button><button class="btn" id="res-atlas" type="button">Atlas</button></div>
 </div>
</dialog>

<div class="sr" aria-live="polite" id="live"></div>

<details class="proto" lang="cs">
 <summary>Maketa (ovládání, není součást hry)</summary>
 <div class="pbody">
  <label>Scénář <select id="p-scenario"><option>start</option><option>early</option><option>mid</option><option>broke</option><option>late</option><option>delivered</option></select></label>
  <label>Jazyk <select id="p-lang"><option>en</option><option>cs</option></select></label>
  <label>Obrazovka <select id="p-view"><option value="workshop">Dílna</option><option value="aim">Míření (čip Sail)</option></select></label>
  <label>Vítr (míření) <select id="p-wind"><option value="tail">do zad</option><option value="calm">klid</option><option value="head">proti</option></select></label>
  <label>Pohyb <select id="p-motion"><option value="system">podle systému</option><option value="reduce">omezený</option></select></label>
  <label>Chyba uložení při koupi <select id="p-fail"><option value="0">ne</option><option value="1">ano</option></select></label>

function planeSVG(shape,{acc={},paper='#ffffff',stamp=null,mode='full',w=320,h=180,cx=w/2,cy=h/2,sc=Math.min(w,h)*.42}={}){

 if(mode==='silhouette')return `<g class="pv-plane"><polygon points="${pts([tailT,nose,notch])}" fill="rgb(107 97 88/.4)"/><polygon points="${pts([tailB,keel,nose,notch])}" fill="rgb(107 97 88/.4)"/></g>`;

 const lerp=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
 let deco='',fin='';
 if(shape.fin){const a=lerp(notch,nose,.2),b=lerp(notch,nose,.75),c=[cx-L*.05,cy-sc*shape.fin];fin=`<polygon points="${pts([a,c,b])}" fill="${top}" stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-dasharray="${dash}"/>`;}
 if(!sketch){
  if(acc.lines)for(let i=1;i<=3;i++){const k=i/4,a=lerp(tailT,notch,k),b=lerp(tailT,nose,.15+k*.6);deco+=`<line x1="${f(a[0]+6)}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1]+3)}" stroke="${acc.lines}" stroke-width="1.4"${acc.dash?' stroke-dasharray="3 2"':''}/>`;}

  if(acc.rings){const p=lerp(lerp(tailT,nose,.45),notch,.3);for(const r of [.05,.1,.15])deco+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(sc*r)}" fill="none" stroke="${acc.rings}" stroke-width="1.2"/>`;}
  if(acc.edge==='stripes')for(let i=0;i<6;i++){const a=lerp(tailT,nose,.1+i*.12);deco+=`<line x1="${f(a[0])}" y1="${f(a[1]+3)}" x2="${f(a[0]+6)}" y2="${f(a[1]+5)}" stroke="${i%2?'#3d4f7a':'#b5503c'}" stroke-width="3"/>`;}
  if(acc.bands)for(const k of [.35,.6]){const a=lerp(tailT,nose,k),b=lerp(notch,nose,k);deco+=`<line x1="${f(a[0])}" y1="${f(a[1]+3)}" x2="${f(b[0])}" y2="${f(b[1]-2)}" stroke="${acc.bands}" stroke-width="5"/>`;}
  if(acc.tip){const a=lerp(tailT,notch,.5);deco+=`<circle cx="${f(a[0]+4)}" cy="${f(a[1])}" r="${f(sc*.05)}" fill="${acc.tip}"/>`;}
  if(acc.dots)acc.dots.forEach((c,i)=>{const a=lerp(lerp(tailT,nose,.25+i*.18),notch,.35),r=sc*.04;deco+=`<polygon points="${pts([[a[0],a[1]-r],[a[0]+r,a[1]],[a[0],a[1]+r],[a[0]-r,a[1]]])}" fill="${c}"/>`;});
  if(stamp){const a=lerp(lerp(tailT,nose,.55),notch,.45);deco+=stampMark(stamp,+f(a[0]),+f(a[1]),Math.max(5,sc*.09));}
 }

  `<polygon points="${pts([tailT,nose,notch])}" fill="${top}"/><g>${deco}</g><polygon points="${pts([tailT,nose,notch])}" fill="none" stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-dasharray="${dash}"/>`+
  `<line x1="${f(notch[0])}" y1="${f(cy)}" x2="${f(nose[0])}" y2="${f(cy)}" stroke="${ink}" stroke-width="${sketch?1.2:1.4}" stroke-dasharray="${dash}"/></g>`;

function compare(m,ref,isHand){
 const row=(label,k)=>{const v=m[k],w=v/maxOf(k);let delta='',aria='';
  if(ref&&!isHand){const r=v/ref[k]-1;delta=Math.abs(r)<.005?t('planes.same'):(r>0?'▲ ':'▼ ')+spct(r);if(Math.abs(r)>=.005)aria=t(r>0?'planes.up':'planes.down',{value:pct(Math.abs(r))});}
  return `<span>${label}</span><span class="bar" aria-hidden="true"><i style="transform:scaleX(${w.toFixed(3)})"></i>${ref&&!isHand?`<b style="left:calc(${(ref[k]/maxOf(k)*100).toFixed(1)}% - 1px)"></b>`:''}</span><span class="delta num">${delta}${aria?`<span class="sr"> (${aria})</span>`:''}</span>`;};
 let stats=`<div class="stats">${row(t('planes.statSpeed'),'speed')}${row(t('planes.statGlide'),'glide')}${row(t('planes.statEvents'),'events')}`+
  `<span>${t('planes.statAngle')}</span><span class="num" style="grid-column:span 2">${ref&&!isHand?t('planes.angleNow',{angle:m.angle+'°',current:ref.angle+'°'}):m.angle+'°'}</span></div>`;
 if(ref&&!isHand&&m.angle!==ref.angle)stats+=`<p class="note">${t(m.angle>ref.angle?'planes.aimHigher':'planes.aimLower')}</p>`;
 const A=ref?path(ref):null,B=path(m),all=A?A.concat(B):B,Dx=Math.max(...all.map(p=>p[0]))*1.05,Hy=Math.max(...all.map(p=>p[1]))*1.15;
 const X=x=>(8+x/Dx*304).toFixed(1),Y=y=>(88-y/Hy*78).toFixed(1),line=pts=>pts.map((p,i)=>(i?'L':'M')+X(p[0])+' '+Y(p[1])).join(' ');
 const ni=PLACE_AT.findIndex(a=>a>S.best),np=ni>=0&&PLACE_AT[ni]<Dx?`<line x1="${X(PLACE_AT[ni])}" y1="10" x2="${X(PLACE_AT[ni])}" y2="88" stroke="#c9b46a" stroke-width="2"/><text x="${(+X(PLACE_AT[ni])+4).toFixed(1)}" y="20" font-size="10" fill="#4a4038">${placeName(ni)}</text>`:'';
 const label=ref?t(isHand?'planes.previewLabelPrev':'planes.previewLabel',{current:t('model.'+ref.id),other:t('model.'+m.id)}):t('model.'+m.id);
 const chart=`<svg class="chart" viewBox="0 0 320 96" role="img" aria-label="${label}">${np}<line x1="8" y1="88" x2="312" y2="88" stroke="#cbbfa8"/>`+
  (A?`<path d="${line(A)}" fill="none" stroke="var(--wk-path-now)" stroke-width="1.5" stroke-dasharray="5 4"/>`:'')+
  `<path d="${line(B)}" fill="none" stroke="var(--wk-path-new)" stroke-width="2.6"/><g id="mini"><polygon points="-6,-3 6,0 -6,3 -3,0" fill="#fff" stroke="#2a2622" stroke-width="1.2"/></g></svg>`;
 miniPath={pts:B,X,Y};
 const legend=ref?`<div class="legend" aria-hidden="true"><span>${t('model.'+ref.id)}</span><span class="new">${t('model.'+m.id)}</span></div>`:'';
 const estTxt=ref?t('planes.estimate',{now:mtr(est(ref)),after:mtr(est(m))}):t('planes.estimateOwn',{now:mtr(est(m))});
 return `<div class="detail-grid"><div>${stats}</div><div>${chart}${legend}<p class="est num">${estTxt}</p><p class="note">${t('planes.estimateNote')}</p><p class="note">${t('planes.shared')}</p></div></div>`;
}

function flyMini(){cancelAnimationFrame(flyRaf);const g=document.getElementById('mini');if(!g||!miniPath)return;const {pts,X,Y}=miniPath;
 const place=f=>{const n=pts.length-1,i=Math.max(0,Math.min(n-1,Math.floor(f*n))),a=pts[i],b=pts[i+1]??a,k=f*n-i;const x=+X(a[0]+(b[0]-a[0])*k),y=+Y(a[1]+(b[1]-a[1])*k);const ang=Math.atan2(+Y(b[1])-+Y(a[1]),+X(b[0])-+X(a[0]))*180/Math.PI;g.setAttribute('transform',`translate(${x} ${y}) rotate(${ang.toFixed(1)})`);};
 if(reduced()){place(.999);return;}const t0=performance.now();const step=now=>{const f=Math.min(1,(now-t0)/600),e=1-(1-f)**3;place(Math.min(.999,e));if(f<1)flyRaf=requestAnimationFrame(step);};flyRaf=requestAnimationFrame(step);}
// šipky jen přesouvají fokus (spec §12 bod 2), Enter / mezerník = klepnutí
function roving(e,list){const btns=[...list.querySelectorAll('.card')],i=btns.indexOf(e.currentTarget);let j=null;
 if(e.key==='ArrowRight'||e.key==='ArrowDown')j=Math.min(btns.length-1,i+1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')j=Math.max(0,i-1);if(e.key==='Home')j=0;if(e.key==='End')j=btns.length-1;
 if(j!==null){e.preventDefault();btns[i].tabIndex=-1;btns[j].tabIndex=0;btns[j].focus();btns[j].scrollIntoView({block:'nearest',inline:'nearest'});}}
const focusCard=id=>$('panel').querySelector(`.card[data-id="${id}"]`)?.focus();
function howText(h,isStamp){switch(h.type){case 'district':return t('looks.howDistrict',{district:t('district.'+h.d)});case 'route':return t('looks.howRoute');
 case 'perfect':return t('stamps.howPerfect',{event:t('event.'+h.event)});case 'star':return t('stamps.howStar');}return '';}
const howOf=(kind,x)=>kind==='print'&&x.how.type==='flag'?t('look.'+x.id+'.how'):howText(x.how);
function orderItems(list,cur){const open=list.filter(x=>condOpen(x.how)),locked=list.filter(x=>!condOpen(x.how));
 return open.filter(x=>x.id===cur).concat(open.filter(x=>x.id!==cur&&x.id!=='plain').reverse(),open.filter(x=>x.id==='plain'&&x.id!==cur),locked);}
function renderLooks(p){
 let top='';
 if(S.retro){top+=`<p class="retro" role="status">${t('looks.retro',{count:S.retro})}</p>`;S.retro=0;}
 top+=`<p class="note">${t('looks.note')}</p>`;
 const hand=M(S.hand);
 top+=`<div class="layers"><strong>${t('looks.layersTitle')}</strong><ul><li>${t('looks.layerPlane',{name:t('model.'+hand.id)})}</li>`+
  `<li><button type="button" class="linkish" id="to-upg">${t('looks.layerPaper',{name:t('paper.'+S.paper)})}</button></li>`+
  `<li>${t('looks.layerPrint',{name:t('look.'+S.print)})}</li><li>${t('looks.layerStamp',{name:S.stamp?t('stamp.'+S.stamp):t('stamps.none')})}</li></ul></div>`;
 p.insertAdjacentHTML('beforeend',top);
 $('to-upg').onclick=()=>switchTab('upgrades');
 const grid=(kind,items,cur)=>{const h=document.createElement('h3');h.className='sec';h.id='sec-'+kind;h.textContent=t(kind==='print'?'looks.prints':'looks.stamps');p.append(h);
  const ul=document.createElement('ul');ul.className='swatches'+(kind==='stamp'?' stamps':'');ul.setAttribute('aria-labelledby','sec-'+kind);
  for(const x of items){const li=document.createElement('li'),b=document.createElement('button'),id=x?x.id:null,open=x?condOpen(x.how):true,worn=id===cur,isNew=open&&id&&id!=='plain'&&!S.seen.includes(id);
   b.type='button';b.dataset.id=kind+':'+id;b.className='card'+(worn?' held':'')+(inspectL&&inspectL.kind===kind&&inspectL.id===id&&!worn?' inspect':'');
   if(open)b.setAttribute('aria-pressed',worn);else b.setAttribute('aria-controls','detail');
   b.tabIndex=worn?0:-1;
   const name=x?t((kind==='print'?'look.':'stamp.')+id):t('stamps.none');
   const art=kind==='print'?planeSVG(hand.shape,{acc:x.acc,paper:PAPER_TONE[S.paper],mode:open?'full':'sketch',w:120,h:50,sc:44})
    :(x?`<path d="${x.d}" fill="none" stroke="${open?'#2a2622':'var(--wk-sketch-stroke)'}" stroke-width="1.6"${open?'':' stroke-dasharray="3 2"'}/>`:`<circle cx="12" cy="12" r="8" fill="none" stroke="#cbbfa8" stroke-width="1.6" stroke-dasharray="2 2"/>`);
   b.innerHTML=`<svg viewBox="${kind==='print'?'0 0 120 50':'0 0 24 24'}" aria-hidden="true">${art}</svg><span class="nm">${name}${isNew?`<span class="tag-new" aria-hidden="true">${t('workshop.newTag')}</span>`:''}</span>`+
    (worn?`<span class="st">✓ ${t('looks.wearing')}</span>`:open?'':`<span class="st">${lock}</span>`);
   b.setAttribute('aria-label',open?name+(worn?', '+t('looks.wearing'):'')+(isNew?', '+t('workshop.newTag'):''):t('looks.lockedAria',{name,how:howOf(kind,x)}));
   b.onclick=()=>{if(open){wear(kind,id);}else{inspectL={kind,id,open:false};render();}focusSw(kind,id);};
   b.onkeydown=e=>roving(e,ul);li.append(b);ul.append(li);}
  if(!ul.querySelector('[tabindex="0"]'))ul.querySelector('.card').tabIndex=0;
  p.append(ul);};
 grid('print',orderItems(PRINTS,S.print),S.print);
 grid('stamp',[null,...orderItems(STAMPS,S.stamp)],S.stamp);
 // detail naposledy klepnuté položky (výchozí = nasazený potisk)
 const sel=inspectL||{kind:'print',id:S.print,open:true},list=sel.kind==='print'?PRINTS:STAMPS,x=sel.id?list.find(i=>i.id===sel.id):null;
 const d=document.createElement('div');d.className='detail';d.id='detail';d.setAttribute('aria-live','polite');
 const name=x?t((sel.kind==='print'?'look.':'stamp.')+x.id):t('stamps.none');
 if(x&&!condOpen(x.how))d.innerHTML=`<h2><span>${name}</span>${lock}</h2>${sel.kind==='print'?`<p>${t('look.'+x.id+'.desc')}</p>`:''}<p class="locked-how">${t('looks.how',{how:howOf(sel.kind,x)})}</p>`;
 else d.innerHTML=`<h2><span>${name}</span></h2>${sel.kind==='print'&&x?`<p>${t('look.'+x.id+'.desc')}</p>`:''}<p class="note">${t('looks.fitsAll')}</p>`;
 p.append(d);
}
const focusSw=(kind,id)=>$('panel').querySelector(`.card[data-id="${kind}:${id}"]`)?.focus();
function renderUpgrades(p){
 const lv=S.lv,br=[['power',Math.min(3,Math.ceil(lv/4))],['paper',lv],['folds',Math.min(3,Math.floor(lv/4))]];
 let h=S.coins===0?`<p class="note">${t('workshop.empty')}</p>`:'';
 h+=`<p class="note">${t('upg.stub')}</p>`;
 for(const [b,n] of br){h+=`<div class="branch"><strong>${t('upg.'+b)}</strong>`;const max=b==='paper'?12:3;for(let i=1;i<=Math.min(max,6);i++)h+=`<span class="node${i<=n?' own':''}" aria-hidden="true">${i<=n?'✓':i}</span>`;h+='</div>';}
 p.insertAdjacentHTML('beforeend',h);
}
// pás akce: u zamčené k prodeji / s nedosaženým místem jen „Koupit“ + vždy jedno „Hodit“ (06 obsah 6)
function renderAction(){
 const a=$('action');a.innerHTML='';let main=null,why='';
 const throwBtn=mk(t('workshop.launch'),()=>live(t('aim.thrown')));
 if(tab==='planes'&&inspect){const x=stOf(inspect),m=x.m;
  if(x.st==='forSale'||x.st==='needPlace'){const pr=m.unlock.price;
   if(x.st==='needPlace')why=t('planes.needPlace',{place:placeName(m.unlock.place)});else if(S.coins<pr)why=t('detail.missing',{count:pr-S.coins});
   main=mk(t('planes.buy',{price:num(pr)}),()=>{if(!why)askBuy(m);});
   if(why){main.setAttribute('aria-disabled','true');main.setAttribute('aria-describedby','why');}}}
 if(why)a.insertAdjacentHTML('beforeend',`<p class="why num" id="why">${why}</p>`);
 if(main){main.classList.add('primary');a.append(main,throwBtn);}else{throwBtn.classList.add('primary');a.append(throwBtn);}
}
function mk(text,fn){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=text;b.onclick=fn;return b;}
function refold(quick){if(reduced())return;const pv=$('preview');pv.classList.remove('refold','refold-quick');void pv.offsetWidth;pv.classList.add(quick?'refold-quick':'refold');}
function take(id,from){if(id===S.hand)return;sessionPrev=S.hand;S.prev=S.hand;S.hand=id;inspect=null;justTook=id;
 if(from==='card'){render();refold(true);focusCard(id);}
 live(t('planes.inHandDone',{name:t('model.'+id)}));}
function wear(kind,id){if(kind==='print'){if(S.print===id)return;S.print=id;}else{if(S.stamp===id)return;S.stamp=id;}
 inspectL={kind,id,open:true};render();refold(true);live(t('looks.woreDone',{name:id?t((kind==='print'?'look.':'stamp.')+id):t('stamps.none')}));}
let buying=null;
function askBuy(m){buying=m;const pr=m.unlock.price;
 $('buy-title').textContent=t('buy.title',{name:t('model.'+m.id)});$('buy-coins').textContent=t('buy.coins',{now:num(S.coins),after:num(S.coins-pr)});
 $('buy-hand').textContent=t('buy.toHand');$('buy-ok').textContent=t('buy.confirm',{price:num(pr)});$('buy-no').textContent=t('buy.cancel');$('buy-err').innerHTML='';
 $('buy').showModal();$('buy-no').focus();}
$('buy-no').onclick=()=>$('buy').close();
$('buy').addEventListener('close',()=>{if(buying){buying=null;$('action').querySelector('.btn.primary')?.focus();}});
$('buy-ok').onclick=()=>{const m=buying;if(!m)return;if(opt.fail||$('p-fail').value==='1'){$('buy-err').innerHTML=`<span class="err"><span aria-hidden="true">⚠</span>${t('buy.failed')}</span>`;return;}buying=null;$('buy').close();doBuy(m);};
function doBuy(m){if(S.bought.includes(m.id)||S.coins<m.unlock.price||!placeReached(m))return;const from=S.coins;S.coins-=m.unlock.price;S.bought.push(m.id);
 sessionPrev=S.hand;S.prev=S.hand;S.hand=m.id;inspect=null;justTook=m.id;render();countCoins(from,S.coins);refold(false);
 live(t('planes.inHandDone',{name:t('model.'+m.id)}));$('action').querySelector('.btn.primary')?.focus();}
function countCoins(a,b){if(reduced()){wallet(b);return;}const t0=performance.now();const step=now=>{const f=Math.min(1,(now-t0)/300);wallet(Math.round(a+(b-a)*f));if(f<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

/* ---------- výsledek s novinkou (§7): jedna novinka za hod ---------- */
const PRIO={place:1,paper:2,plane:3,forSale:4,look:5,stamp:6};
function showResult(){
 const news=[...S.news].sort((a,b)=>PRIO[a.type]-PRIO[b.type]);
 $('res-dist').textContent=mtr(S.best);$('res-coins').textContent=t('result.coinsLabel',{count:Math.round(10+S.best/10)});
 const box=$('res-news');box.innerHTML='';
 if(news.length){const n=news[0];let label,art,act=null;
  if(n.type==='look'){label=t('result.newLook',{name:t('look.'+n.id)});art=handPlane(M(S.hand),{acc:P(n.id).acc,w:40,h:40,sc:30});act=S.print===n.id?null:'wear';}
  else if(n.type==='stamp'){label=t('result.newStamp',{name:t('stamp.'+n.id)});art=`<g transform="translate(8 8)"><path d="${ST(n.id).d}" fill="none" stroke="#2a2622" stroke-width="1.6"/></g>`;act=S.stamp===n.id?null:'wearStamp';}
  else if(n.type==='plane'){label=t('result.newPlane',{name:t('model.'+n.id)});art=planeSVG(M(n.id).shape,{w:40,h:40,sc:30});act=S.hand===n.id?null:'take';}
  else{label=t('result.planeForSale',{name:t('model.'+n.id)});art=planeSVG(M(n.id).shape,{w:40,h:40,sc:30});}
  const row=document.createElement('div');row.className='news'+(reduced()?'':' drop');
  row.innerHTML=`<svg viewBox="0 0 40 40" aria-hidden="true">${art}</svg>`;
  const tb=document.createElement('button');tb.type='button';tb.className='t';tb.textContent=label;
  tb.onclick=()=>{$('result').close();showView('workshop');
   if(n.type==='look'||n.type==='stamp'){tab='looks';inspectL={kind:n.type==='look'?'print':'stamp',id:n.id,open:true};}else{tab='planes';inspect=owns(M(n.id))?null:n.id;}
   render(true);};
  row.append(tb);
  if(act){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=act==='take'?t('result.takeIt'):t('result.wear');
   b.onclick=()=>{if(b.getAttribute('aria-disabled'))return;if(act==='wear')S.print=n.id;else if(act==='wearStamp')S.stamp=n.id;else{S.prev=S.hand;S.hand=n.id;}
    b.textContent=act==='take'?t('result.taken'):t('result.worn');b.setAttribute('aria-disabled','true');render();live(act==='take'?t('planes.inHandDone',{name:t('model.'+n.id)}):b.textContent);};row.append(b);}
  box.append(row);
 }
 $('result').showModal();$('res-again').focus();
}
$('res-again').onclick=()=>$('result').close();
$('res-wk').onclick=()=>{$('result').close();showView('workshop');tab='upgrades';render(true);};
$('res-atlas').onclick=()=>{$('result').close();live('(maketa) Atlas');};
$('close').onclick=()=>{markSeen();inspect=null;inspectL=null;sessionPrev=null;live('(maketa) '+(lang==='cs'?'Dílna by se zavřela.':'The Workshop would close.'));render();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open]')&&!$('wk').hidden)$('close').click();});

/* ---------- obrazovka míření s čipem Sail (§8) ---------- */
let aimSwap=null; // {from,to} po klepnutí: čip nabízí návrat
function chipOffer(){const w=WIND[opt.wind],hand=M(S.hand),sail=M('sail');
 if(aimSwap)return {to:aimSwap.from};
 if(!owns(sail))return null;
 if(S.hand!=='sail'&&w>=.04)return {to:'sail'};
 if(S.hand==='sail'&&w<=-.04&&S.prev&&S.prev!=='sail')return {to:S.prev};
 return null;}
function renderAim(){
 const w=WIND[opt.wind],hand=M(S.hand),ni=PLACE_AT.findIndex(a=>a>S.best);
 $('aim-next').innerHTML=ni>=0?`${t('aim.next',{place:placeName(ni)})}<small>${t('aim.nextDist',{distance:mtr(PLACE_AT[ni]-S.best)})}</small>`:'';
 $('aim-wind').innerHTML=`<span aria-hidden="true">${w>0?'⇢':w<0?'⇠':'·'}</span> ${t('aim.wind.'+opt.wind)}`;
 $('aim-coins').innerHTML=walletHTML(S.coins);
 $('aim-kid').innerHTML=kidSVG+handPlane(hand,{cx:190,cy:88});
 $('aim-hint').textContent=t('aim.hint');
 const slot=$('aim-chip-slot');slot.innerHTML='';const o=chipOffer();
 if(o){const to=M(o.to),gain=windEst(to,w)/windEst(hand,w)-1;
  if(aimSwap||Math.abs(gain)>=.02){const b=document.createElement('button');b.type='button';b.className='sail-chip';b.id='sail-chip';
   b.innerHTML=`<svg viewBox="0 0 60 40" aria-hidden="true">${planeSVG(to.shape,{w:60,h:40,sc:26})}</svg><span><b>${t('aim.swap',{name:t('model.'+to.id)})}</b><span class="g num">${t('aim.swapGain',{value:spct(gain)})}</span></span>`;
   b.setAttribute('aria-label',t('aim.swapAria',{name:t('model.'+to.id),value:spct(gain)}));
   b.addEventListener('pointerdown',e=>e.stopPropagation());
   b.onclick=e=>{e.stopPropagation();const from=S.hand;S.prev=from;S.hand=to.id;aimSwap=aimSwap?null:{from};renderAim();refoldAim();$('sail-chip')?.focus();live(t('planes.inHandDone',{name:t('model.'+to.id)}));};
   slot.append(b);}}
}
function refoldAim(){if(reduced())return;const k=$('aim-kid');k.classList.remove('refold-quick');void k.getBoundingClientRect();k.classList.add('refold-quick');}
$('aim').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;live(t('aim.thrown'));});
document.addEventListener('keydown',e=>{if($('aim').hidden)return;if(e.key===' '&&!e.target.closest('button,select,summary')){e.preventDefault();live(t('aim.thrown'));}});
function showView(v){$('aim').hidden=v!=='aim';$('wk').hidden=v==='aim';if(v==='aim'){staticTexts();renderAim();}}

/* ---------- panel makety ---------- */
const sel={scenario:'p-scenario',lang:'p-lang',view:'p-view',wind:'p-wind',motion:'p-motion'};
$('p-scenario').value=opt.scenario in SCEN?opt.scenario:'mid';$('p-lang').value=lang;$('p-view').value=opt.view;$('p-wind').value=opt.wind;$('p-motion').value=opt.motion;$('p-fail').value=opt.fail?'1':'0';
for(const [k,id] of Object.entries(sel))$(id).onchange=()=>{const u=new URLSearchParams(location.search);u.set(k,$(id).value);location.search=u.toString();};
$('p-result').onclick=showResult;
$('p-lost').onclick=()=>{lost=!lost;renderPreview();live(lost?t('status.glLost'):t('status.glBack'));};

render();
showView(opt.view);
</script>
