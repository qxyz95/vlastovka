<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just Throw It · Workshop prototype</title>
<!-- Maketa Dílny (vlaštovky za mince a postup, Vzhled). Spec: research/obsah/02-ux-dilna.md. Falešná data, nesahá do src/. -->
<style>
:root{
 /* 1 primitivní (bible 05-styl-papir kap. 2.1) */
 --paper-0:#ffffff;--cream-50:#fbf6ec;--card-100:#f4ecdc;--graphite-900:#2a2622;--pencil-500:#6b6158;--pencil-700:#4a4038;
 --desk-300:#d9c4a0;--tape-200:#efe0a8;--tomato-500:#d9472b;--tomato-600:#c43f25;--tomato-700:#a8341e;--teal-600:#13807d;
 --mustard-400:#e2a43a;--mustard-800:#8a5a00;--cobalt-600:#2456c9;--warm-grey-400:#8c8379;--shade:#3b3560;
 /* 2 role */
 --ink:var(--graphite-900);--text:var(--graphite-900);--dim:var(--pencil-500);--dim-on-desk:var(--pencil-700);
 --card:var(--cream-50);--card-2:var(--card-100);--desk:var(--desk-300);--tape:var(--tape-200);
 --color-reward:var(--mustard-400);--color-reward-text:var(--mustard-800);--color-success:var(--teal-600);
 --color-new:var(--tape-200);--color-locked:var(--pencil-500);--focus:var(--cobalt-600);
 --display:"Trebuchet MS","Segoe UI Semibold","Avenir Next",sans-serif;--body:"Segoe UI","Avenir Next",system-ui,sans-serif;--hand:"Segoe Print","Bradley Hand",cursive;
 --lift:0 2px 0 rgb(40 25 10/.12),0 6px 14px rgb(59 53 96/.18);--lift-hi:0 3px 0 rgb(40 25 10/.14),0 10px 22px rgb(59 53 96/.24);
 --r:4px;--t-fast:120ms;--t-mid:240ms;
 /* 3 komponenty */
 --btn-primary-bg:var(--tomato-600);--btn-primary-fg:var(--cream-50);--btn-primary-edge:var(--tomato-700);
 --btn-bg:var(--cream-50);--btn-fg:var(--ink);--btn-edge:#cbbfa8;--btn-disabled-bg:#e9e1d1;--btn-disabled-fg:#6b6158;
 --wk-card-w:120px;--wk-card-h:132px;--wk-card-bg:var(--card);--wk-card-held-border:3px solid var(--ink);--wk-card-picked-border:2px dashed var(--ink);
 --wk-sketch-stroke:var(--color-locked);--wk-tag-new-bg:var(--color-new);--wk-tag-new-fg:var(--ink);--wk-price-fg:var(--color-reward-text);
 --wk-stat-fill:var(--ink);--wk-stat-track:var(--desk);--wk-path-now:var(--dim);--wk-path-new:var(--ink);--wk-tab-mark:var(--tape);
 --wk-preview-h:clamp(140px,30dvh,260px);--wk-action-h:56px;
}
@media (max-width:340px){:root{--wk-card-w:104px;--wk-card-h:124px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--text);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:var(--color-reward);border:2px solid var(--ink);vertical-align:-.1em;margin-left:.2em}

/* panel Dílny */
.wk{display:flex;flex-direction:column;height:100dvh;background:var(--card);max-width:100%}
.wk-head{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));border-bottom:1px solid var(--btn-edge)}
.wk-head h1{flex:1;margin:0;font:700 clamp(20px,5vw,26px)/1.1 var(--display)}
.wallet{font:700 18px var(--display);white-space:nowrap}
.icon{min-width:44px;min-height:44px;border:2px solid var(--btn-edge);border-radius:var(--r);background:var(--btn-bg);cursor:pointer}
.wk-body{flex:1;display:flex;flex-direction:column;min-height:0}
.preview{position:relative;height:var(--wk-preview-h);flex:none;background:linear-gradient(#a6d0e8,#d8e9ea 60%,#fce4c6);overflow:hidden}
.preview svg{width:100%;height:100%;display:block}
.preview .pv-cap{position:absolute;left:12px;bottom:8px;background:var(--card);padding:2px 8px;border-radius:var(--r);font:600 14px var(--display);box-shadow:var(--lift);transform:rotate(-1.5deg)}
.preview .chip{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream-50);padding:4px 10px;border-radius:var(--r);font-size:14px}
.preview.lost svg .pv-plane{opacity:.35}
.pv-plane{transform-origin:50% 50%;transform-box:fill-box}
.refold .pv-plane{animation:refold 750ms ease-out}
.refold-quick .pv-plane{animation:refold 300ms ease-out}
@keyframes refold{0%{transform:scale(1) rotate(0)}35%{transform:scale(.2,1) rotate(-8deg);opacity:.6}100%{transform:scale(1) rotate(0);opacity:1}}
.wk-main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--btn-edge);flex:none}
.tabs[hidden]{display:none}
.tab{flex:1;min-height:48px;border:0;background:none;color:var(--dim);font:600 16px var(--display);cursor:pointer;position:relative;padding:0 6px}
.tab[aria-selected=true]{color:var(--text);font-weight:700}
.tab[aria-selected=true]::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:4px;background:var(--wk-tab-mark);border-top:1px solid #c9b46a}
.tab:hover{color:var(--text)}
.tag-new{display:inline-block;background:var(--wk-tag-new-bg);color:var(--wk-tag-new-fg);font:700 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:2px;transform:rotate(-2deg);box-shadow:0 1px 0 rgb(40 25 10/.15);margin-left:4px;vertical-align:2px}
.panel{flex:1;overflow-y:auto;padding:12px 16px 16px;scroll-padding-bottom:calc(var(--wk-action-h) + 16px)}
.panel.enter{animation:enter 200ms ease-out}
@keyframes enter{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.note{font-size:14px;color:var(--dim);margin:4px 0 12px}

/* karty modelů */
.cards{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 10px;margin:0 -16px;list-style:none;overscroll-behavior-x:contain}
.cards li{flex:none;scroll-snap-align:start}
.card{width:var(--wk-card-w);height:var(--wk-card-h);border:2px solid transparent;border-radius:var(--r);background:var(--wk-card-bg);box-shadow:var(--lift);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 6px 8px;cursor:pointer;transition:transform var(--t-fast) ease-out,box-shadow var(--t-fast) ease-out;text-align:center}
.card svg{width:100%;height:58px}
.card .nm{font:700 15px/1.15 var(--display);overflow-wrap:anywhere}
.card .st{font-size:13px;color:var(--dim);line-height:1.2}
.card .price{color:var(--wk-price-fg);font:700 14px var(--display)}
@media (pointer:fine){.card:hover{box-shadow:var(--lift-hi);transform:translateY(-2px)}}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 rgb(40 25 10/.2)}
.card[aria-pressed=true]{border:var(--wk-card-picked-border)}
.card.held{border:var(--wk-card-held-border)}
.card.hidden-m .nm{color:var(--dim)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;list-style:none;padding:0;margin:0 0 12px}
.swatches .card{width:100%;height:auto;min-height:92px}
.swatches .card svg{height:46px}
.swatches .card .nm{font-size:13px}

/* detail */
.detail h2{font:700 clamp(20px,5vw,24px)/1.15 var(--display);margin:8px 0 2px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.detail h2 .price{color:var(--wk-price-fg);font-size:18px}
.detail p{margin:4px 0}
.why{font-size:14px;color:var(--color-reward-text);font-weight:600}
.stats{display:grid;grid-template-columns:minmax(96px,auto) 1fr auto;gap:6px 10px;align-items:center;margin:10px 0;font-size:15px}
.bar{height:10px;background:var(--wk-stat-track);border-radius:2px;position:relative;overflow:hidden;min-width:60px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--wk-stat-fill);transform-origin:left;transition:transform var(--t-mid) ease-out}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tomato-600)}
.delta{font:700 14px var(--display);white-space:nowrap}
.chart{width:100%;height:96px;display:block;background:var(--card-2);border-radius:var(--r);margin:6px 0 2px}
.legend{font-size:13px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:22px;height:0;border-top:2px dashed var(--wk-path-now);vertical-align:middle;margin-right:4px}
.legend span.new::before{border-top:3px solid var(--wk-path-new)}
.est{font:700 17px var(--display);margin-top:8px}
.locked-how{background:var(--card-2);padding:8px 10px;border-radius:var(--r);margin:8px 0}
.retro{background:var(--tape);padding:8px 10px;border-radius:var(--r);margin:0 0 12px;transform:rotate(-.5deg)}
.counter{font:700 14px var(--display);color:var(--dim)}

/* stub stromu */
.branch{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.branch strong{min-width:84px;font-family:var(--display)}
.node{min-width:48px;min-height:48px;border:2px solid var(--btn-edge);border-radius:var(--r);background:var(--card);font:700 14px var(--display)}
.node.own{background:var(--ink);color:var(--cream-50)}

/* pás akce */
.action{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 16px;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--btn-edge);background:var(--card)}
.action .why{margin:0}
.btn{min-height:48px;border-radius:var(--r);border:2px solid var(--btn-edge);border-bottom-width:4px;background:var(--btn-bg);color:var(--btn-fg);font:700 17px var(--display);padding:0 16px;cursor:pointer;transition:transform var(--t-fast) ease-out}
.btn.primary{min-height:56px;background:var(--btn-primary-bg);color:var(--btn-primary-fg);border-color:var(--btn-primary-edge)}
@media (pointer:fine){.btn.primary:hover{background:var(--tomato-500)}.btn:not(.primary):hover{background:#fff}}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn[aria-disabled=true]{background:var(--btn-disabled-bg);color:var(--btn-disabled-fg);border-color:#d6ccb8;border-bottom-width:2px;cursor:not-allowed;transform:none}
.row{display:flex;gap:8px}.row .btn{flex:1}

/* dialogy */
dialog{border:0;border-radius:var(--r);background:var(--card);color:var(--text);box-shadow:var(--lift-hi);padding:20px 16px 16px;width:min(100% - 24px,420px);position:relative}
dialog::backdrop{background:rgb(42 38 34/.45)}
dialog[open]{animation:sheet 280ms ease-out}
@keyframes sheet{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
dialog::before{content:"";position:absolute;top:-8px;left:50%;width:84px;height:18px;margin-left:-42px;background:var(--tape);opacity:.85;transform:rotate(-2deg)}
dialog h2{font:700 22px/1.2 var(--display);margin:0 0 8px}
dialog .err{display:flex;gap:6px;background:#f7e1da;color:var(--text);padding:8px;border-radius:var(--r);margin:8px 0;font-size:15px}
dialog .stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.res-dist{font:700 clamp(36px,10vw,52px)/1 var(--display)}
.news{display:flex;align-items:center;gap:10px;border-left:4px solid var(--ink);padding:6px 0 6px 10px;margin:12px 0 4px}
.news.drop{animation:drop 250ms ease-out}
@keyframes drop{from{transform:scale(.96) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.news svg{width:40px;height:40px;flex:none}
.news .t{flex:1;font:700 16px/1.2 var(--display);background:none;border:0;text-align:left;padding:0;cursor:pointer;min-height:44px}
.news .btn{min-height:44px;font-size:15px}
.more{font-size:14px;color:var(--dim);margin:0 0 8px}

/* panel makety */
.proto{position:fixed;left:8px;bottom:8px;z-index:50;background:#fff;border:2px dashed var(--ink);border-radius:var(--r);font:13px/1.3 system-ui;max-width:calc(100vw - 16px)}
.proto summary{cursor:pointer;padding:8px 10px;min-height:32px}
.proto .pbody{padding:0 10px 10px;display:grid;gap:6px;max-height:60dvh;overflow:auto}
.proto label{display:flex;gap:6px;align-items:center;justify-content:space-between}
.proto select,.proto button{font:inherit;min-height:32px}

/* desktop */
@media (min-width:1024px) and (min-height:600px){
 body{display:grid;place-items:center;padding:24px}
 .wk{height:min(760px,calc(100dvh - 48px));width:min(1080px,100%);border-radius:var(--r);box-shadow:var(--lift-hi);overflow:hidden}
 .wk-body{flex-direction:row}
 .preview{height:auto;width:40%}
 .cards{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:4px 0 10px}
 .cards .card{width:100%}
 .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
 .action{flex-direction:row;align-items:center;flex-wrap:wrap}.action .why{flex-basis:100%}
 .action .btn{flex:1}
}
/* na šířku, nízká výška */
@media (max-height:500px) and (orientation:landscape){
 .wk-body{flex-direction:row}
 .preview{height:auto;width:35%}
}
@media (max-height:640px) and (orientation:portrait){:root{--wk-preview-h:22dvh}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
[data-motion=reduce] *,[data-motion=reduce] *::before,[data-motion=reduce] *::after{animation-duration:1ms!important;transition-duration:1ms!important}
@media (forced-colors:active){.card[aria-pressed=true],.card.held{outline:2px solid CanvasText}.tag-new{border:1px solid CanvasText}}
</style>
</head>
<body>
<section class="wk" aria-labelledby="wk-title">
 <header class="wk-head">
  <button class="icon" id="close" type="button"><span aria-hidden="true">✕</span><span class="sr" data-k="workshop.back"></span></button>
  <h1 id="wk-title" data-k="workshop.title"></h1>
  <span class="wallet num" id="wallet"></span>
 </header>
 <div class="wk-body">
  <div class="preview" id="preview" aria-hidden="true"><svg id="pv" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet"></svg><span class="pv-cap" id="pv-cap" aria-hidden="true"></span></div>
  <div class="wk-main">
   <div class="tabs" role="tablist" id="tabs"></div>
   <div class="panel" id="panel" role="tabpanel" tabindex="0"></div>
   <div class="action" id="action"></div>
  </div>
 </div>
</section>

<dialog id="buy" aria-labelledby="buy-title">
 <h2 id="buy-title"></h2>
 <p class="num" id="buy-coins"></p>
 <div id="buy-err" role="alert"></div>
 <div class="stack">
  <button class="btn primary" id="buy-ok" type="button"></button>
  <button class="btn" id="buy-no" type="button" autofocus></button>
 </div>
</dialog>

<dialog id="result" aria-labelledby="res-title">
 <h2 id="res-title" data-k="result.titleRecord"></h2>
 <div class="res-dist num" id="res-dist"></div>
 <p class="num" id="res-coins"></p>
 <div id="res-news"></div>
 <div class="stack">
  <button class="btn primary" id="res-again" type="button" autofocus data-k="result.again"></button>
  <div class="row"><button class="btn" id="res-wk" type="button" data-k="workshop.title"></button><button class="btn" id="res-atlas" type="button">Atlas</button></div>
 </div>
</dialog>

<div class="sr" aria-live="polite" id="live"></div>

<details class="proto" lang="cs">
 <summary>Maketa (ovládání, není součást hry)</summary>
 <div class="pbody">
  <label>Scénář <select id="p-scenario"><option>start</option><option>early</option><option>mid</option><option>broke</option><option>late</option><option>delivered</option></select></label>
  <label>Jazyk <select id="p-lang"><option>en</option><option>cs</option></select></label>
  <label>B3 zamčené modely <select id="p-reveal"><option value="near">near (doporučeno)</option><option value="all">all</option><option value="next">next</option></select></label>
  <label>B4 potvrzení koupě <select id="p-confirm"><option value="1">ano (doporučeno)</option><option value="0">ne</option></select></label>
  <label>B6 po koupi do ruky <select id="p-autouse"><option value="1">ano (doporučeno)</option><option value="0">ne</option></select></label>
  <label>B1 počítadlo vzhledů <select id="p-counter"><option value="0">ne (doporučeno)</option><option value="1">ano</option></select></label>
  <label>Pohyb <select id="p-motion"><option value="system">podle systému</option><option value="reduce">omezený</option></select></label>
  <button type="button" id="p-result">Ukázat Výsledek s novinkou</button>
  <button type="button" id="p-lost">Ztráta / obnova WebGL (náhled)</button>
  <label>Chyba uložení při koupi <select id="p-fail"><option value="0">ne</option><option value="1">ano</option></select></label>
  <span>Čísla, jména a podmínky jsou zástupné. Spec: research/obsah/02-ux-dilna.md</span>
 </div>
</details>

<script>
'use strict';
const q=new URLSearchParams(location.search);
const opt={scenario:q.get('scenario')||'mid',lang:q.get('lang')==='cs'?'cs':'en',reveal:['all','near','next'].includes(q.get('reveal'))?q.get('reveal'):'near',
 confirm:q.get('confirm')!=='0',autouse:q.get('autouse')!=='0',counter:q.get('counter')==='1',motion:q.get('motion')==='reduce'?'reduce':'system',fail:q.get('savefail')==='1'};
let lang=opt.lang;
document.documentElement.lang=lang;
if(opt.motion==='reduce')document.body.dataset.motion='reduce';
const reduced=()=>opt.motion==='reduce'||matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- texty (klíče ze spec §14 + zástupná jména) ---------- */

 case 'route':return S.best>=4876;case 'perfect':return !!S.flags.perfect;case 'plane':return !!S.flags[h.plane];case 'distance':return S.best>=h.v;}return false;}

 const own=MODELS.filter(owns),rest=MODELS.filter(m=>!owns(m)).sort((a,b)=>threshold(a)-threshold(b));
 const eligible=rest.filter(m=>m.unlock.type!=='coins'||S.best>=m.unlock.shownAt);
 const out=own.map(m=>({m,vis:'full'}));
 if(opt.reveal==='all')return out.concat(rest.map(m=>({m,vis:'full'})));
 const n=opt.reveal==='near'?2:1,full=eligible.slice(0,n);
 for(const m of rest){if(full.includes(m))out.push({m,vis:'full'});else if(opt.reveal==='near')out.push({m,vis:'hidden'});}
 return out;
}

function planeSVG(shape,acc,{sketch=false,w=320,h=180,cx=w/2,cy=h/2,sc=Math.min(w,h)*.42}={}){
 const L=sc*shape.len,Sp=sc*shape.span,n=sc*shape.notch;
 const nose=[cx+L*.6,cy],tailT=[cx-L*.55,cy-Sp*.55],tailB=[cx-L*.55,cy+Sp*.25],notch=[cx-L*.55+n,cy],keel=[cx-L*.35,cy+Sp*.42];
 const P=a=>a.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
 const ink=sketch?'var(--wk-sketch-stroke)':'#2a2622',sw=sketch?1.6:2.6,dash=sketch?'4 3':'';
 const fillTop=sketch?'none':(acc.fill||'#ffffff'),fillLow=sketch?'none':'#cdd3e3';
 let deco='';
 if(!sketch){
  if(acc.lines)for(let i=1;i<=3;i++){const f=i/4;deco+=`<line x1="${(tailT[0]+(nose[0]-tailT[0])*f*.2).toFixed(1)}" y1="${(tailT[1]+(cy-tailT[1])*f).toFixed(1)}" x2="${(nose[0]-L*.25*(1-f)).toFixed(1)}" y2="${(cy-Sp*.05*(1-f)).toFixed(1)}" stroke="${acc.lines}" stroke-width="1.6"/>`;}
  if(acc.edge==='stripes'){for(let i=0;i<6;i++){const f=i/6,x=tailT[0]+(nose[0]-tailT[0])*f,y=tailT[1]+(nose[1]-tailT[1])*f;deco+=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+8).toFixed(1)}" y2="${(y+2).toFixed(1)}" stroke="${i%2?'#2456c9':'#d9472b'}" stroke-width="4"/>`;}}
  else if(acc.edge)deco+=`<line x1="${tailT[0]}" y1="${tailT[1]}" x2="${nose[0]}" y2="${nose[1]}" stroke="${acc.edge}" stroke-width="4" stroke-linecap="round"/>`;
  if(acc.bands)for(const f of [.35,.6])deco+=`<line x1="${(tailT[0]+(nose[0]-tailT[0])*f).toFixed(1)}" y1="${(tailT[1]+(nose[1]-tailT[1])*f).toFixed(1)}" x2="${(notch[0]+(nose[0]-notch[0])*f).toFixed(1)}" y2="${cy}" stroke="${acc.bands}" stroke-width="5"/>`;
  if(acc.stamp){const sx=cx-L*.1,sy=cy-Sp*.2;deco+=`<rect x="${(sx-7).toFixed(1)}" y="${(sy-6).toFixed(1)}" width="14" height="12" fill="none" stroke="${acc.stamp}" stroke-width="1.6" stroke-dasharray="2 1.5"/><circle cx="${(sx+9).toFixed(1)}" cy="${(sy+4).toFixed(1)}" r="5" fill="none" stroke="${acc.stamp}" stroke-width="1.2"/>`;}
  if(acc.tip)deco+=`<circle cx="${(nose[0]-6).toFixed(1)}" cy="${cy-1}" r="4" fill="${acc.tip}" stroke="#2a2622" stroke-width="1"/>`;
  if(acc.dots)for(let i=0;i<7;i++){const f=(i*37%100)/100,g=(i*61%100)/100;deco+=`<circle cx="${(tailT[0]+L*.9*f+6).toFixed(1)}" cy="${(tailT[1]+Sp*.45*g+3).toFixed(1)}" r="1.6" fill="${acc.dots}"/>`;}
  if(acc.quarters){acc.quarters.forEach((c,i)=>{const f=.2+i*.17;deco+=`<circle cx="${(tailT[0]+(nose[0]-tailT[0])*f).toFixed(1)}" cy="${(tailT[1]+(cy-tailT[1])*f*1.1+4).toFixed(1)}" r="4" fill="${c}"/>`;});}
 }
 return `<g class="pv-plane"><polygon points="${P([tailB,keel,nose,notch])}" fill="${fillLow}" stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-dasharray="${dash}"/>`+
  `<polygon points="${P([tailT,nose,notch])}" fill="${fillTop}" stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-dasharray="${dash}"/>`+
  `<g>${deco}</g><polygon points="${P([tailT,nose,notch])}" fill="none" stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-dasharray="${dash}"/>`+
  `<line x1="${notch[0]}" y1="${cy}" x2="${nose[0]}" y2="${cy}" stroke="${ink}" stroke-width="${sketch?1.2:1.4}" stroke-dasharray="${dash}"/></g>`;
}

  b.onkeydown=e=>{const i=list.indexOf(k);let j=null;if(e.key==='ArrowRight')j=(i+1)%list.length;if(e.key==='ArrowLeft')j=(i-1+list.length)%list.length;if(e.key==='Home')j=0;if(e.key==='End')j=list.length-1;if(j!==null){e.preventDefault();switchTab(list[j]);$('tab-'+list[j]).focus();}};
  el.append(b);}
 const pn=$('panel');if(list.length>1){pn.setAttribute('role','tabpanel');pn.setAttribute('aria-labelledby','tab-'+tab);}else{pn.removeAttribute('role');pn.removeAttribute('aria-labelledby');}
}
function switchTab(k){if(tab==='looks'&&k!=='looks')markSeen();tab=k;render(true);}
function markSeen(){for(const l of unseenLooks())S.seen.push(l.id);}
function render(anim=false){
 staticTexts();wallet();renderTabs();
 const p=$('panel');p.innerHTML='';
 if(tab==='planes')renderPlanes(p);else if(tab==='looks')renderLooks(p);else renderUpgrades(p);
 if(anim&&!reduced()){p.classList.remove('enter');void p.offsetWidth;p.classList.add('enter');}
 renderPreview();renderAction();
}
function renderPreview(){
 const svg=$('pv');let body='';
 const m=M(tab==='planes'?pickM:S.inHand),look=L(tab==='looks'?pickL:S.look);
 const hiddenSel=tab==='planes'&&visibleModels().find(x=>x.m.id===pickM)?.vis==='hidden';
 const sketchL=tab==='looks'&&!lookOpen(look);
 const sketchM=tab==='planes'&&!owns(m)&&m.unlock.type!=='coins';
 // ruka dítěte (náznak)
 body+=`<rect x="0" y="150" width="320" height="30" fill="#dcc29b"/><rect x="30" y="98" width="64" height="52" fill="#fbf6ec" stroke="#cbbfa8"/><polygon points="26,98 62,74 98,98" fill="#d9472b"/>`;
 body+=hiddenSel?`<g transform="translate(110 50) scale(1.6)">${silhouetteSVG()}</g>`:planeSVG(m.shape,sketchM?{}:look.acc,{sketch:sketchL||sketchM,cx:190,cy:88});
 svg.innerHTML=body;
 $('pv-cap').textContent=hiddenSel?t('planes.hiddenName'):t('model.'+m.id)+(tab==='looks'?' · '+t('look.'+look.id):'');
 $('preview').classList.toggle('lost',lost);
 let chip=$('preview').querySelector('.chip');if(lost&&!chip){chip=document.createElement('span');chip.className='chip';chip.setAttribute('role','status');$('preview').append(chip);}if(chip)chip.textContent=lost?t('status.glLost'):'';if(!lost&&chip)chip.remove();
}
function cardStatus(m,vis){
 if(vis==='hidden')return t('planes.lockedLater');
 if(m.id===S.inHand)return t('planes.inHand');if(owns(m))return t('planes.ready');
 if(m.unlock.type==='coins')return num(m.unlock.price)+' ◈';
 return t('planes.lockedPlace',{place:placeName(m.unlock.place)});
}
function renderPlanes(p){
 const ul=document.createElement('ul');ul.className='cards';ul.setAttribute('aria-label',t('planes.listLabel'));
 const vis=visibleModels();if(!vis.find(x=>x.m.id===pickM))pickM=S.inHand;
 vis.forEach(({m,vis:v},i)=>{const li=document.createElement('li');const b=document.createElement('button');b.type='button';
  b.className='card'+(m.id===S.inHand?' held':'')+(v==='hidden'?' hidden-m':'');b.setAttribute('aria-pressed',m.id===pickM);b.tabIndex=m.id===pickM?0:-1;
  const name=v==='hidden'?t('planes.hiddenName'):t('model.'+m.id),own=owns(m);
  let st;if(v==='hidden')st=`<span class="st">${flag} ${t('planes.lockedShort')}</span>`;else if(m.id===S.inHand)st=`<span class="st">✓ ${t('planes.inHand')}</span>`;else if(own)st=`<span class="st">${t('planes.ready')}</span>`;
  else if(m.unlock.type==='coins')st=`<span class="price num">${num(m.unlock.price)}<span class="coin" aria-hidden="true"></span></span>`;else st=`<span class="st">${flag} ${t('planes.lockedShort')}</span>`;
  const art=v==='hidden'?`<svg viewBox="0 0 150 60" aria-hidden="true">${silhouetteSVG()}</svg>`:`<svg viewBox="0 0 150 60" aria-hidden="true">${planeSVG(m.shape,own?L(S.look).acc:{},{sketch:!own&&m.unlock.type!=='coins',w:150,h:60,sc:52})}</svg>`;
  b.innerHTML=art+`<span class="nm">${name}</span>`+st;
  b.setAttribute('aria-label',t('planes.cardAria',{name,status:cardStatus(m,v)}));
  b.onclick=()=>{pickM=m.id;render();$('panel').querySelector('.card[aria-pressed=true]')?.focus();};
  b.onkeydown=e=>roving(e,ul);
  li.append(b);ul.append(li);});
 p.append(ul);
 const sel=vis.find(x=>x.m.id===pickM),m=sel.m,cur=M(S.inHand),d=document.createElement('div');d.className='detail';d.setAttribute('aria-live','polite');
 if(sel.vis==='hidden'){d.innerHTML=`<h2>${t('planes.hiddenName')}</h2><p class="locked-how">${flag} ${t('planes.lockedLater')}</p>`;p.append(d);return;}
 const price=m.unlock.type==='coins'&&!owns(m)?`<span class="price num">${num(m.unlock.price)}<span class="coin" aria-hidden="true"></span></span>`:'';
 let html=`<h2><span>${t('model.'+m.id)}</span>${price}</h2><p>${t('model.'+m.id+'.desc')}</p>`;
 if(!owns(m)&&m.unlock.type==='place')html+=`<p class="locked-how">${flag} ${t('planes.lockedPlace',{place:placeName(m.unlock.place)})}</p>`;
 const cmp=m.id!==cur.id;
 const row=(label,k)=>{const v=m[k],c=cur[k],r=v/c-1,w=v/maxOf(k);let delta='';
  if(cmp){delta=Math.abs(r)<.005?t('planes.same'):(r>0?'▲ ':'▼ ')+(r>0?'+':'−')+pct(Math.abs(r));}
  const aria=cmp&&Math.abs(r)>=.005?t(r>0?'planes.up':'planes.down',{value:pct(Math.abs(r))}):'';
  return `<span>${label}</span><span class="bar" aria-hidden="true"><i style="transform:scaleX(${w.toFixed(3)})"></i>${cmp?`<b style="left:calc(${(c/maxOf(k)*100).toFixed(1)}% - 1px)"></b>`:''}</span><span class="delta num">${delta}${aria?`<span class="sr"> (${aria})</span>`:''}</span>`;};
 let stats=`<div class="stats">${row(t('planes.statSpeed'),'speed')}${row(t('planes.statGlide'),'glide')}${row(t('planes.statEvents'),'events')}`+
  `<span>${t('planes.statAngle')}</span><span class="num" style="grid-column:span 2">${cmp?t('planes.angleNow',{angle:m.angle+'°',current:cur.angle+'°'}):m.angle+'°'}</span></div>`;
 if(cmp&&m.angle!==cur.angle)stats+=`<p class="note">${t(m.angle>cur.angle?'planes.aimHigher':'planes.aimLower')}</p>`;
 // graf drah
 const A=path(cur),B=path(m),Dx=Math.max(A.at(-1)[0],B.at(-1)[0])*1.05,Hy=Math.max(...A.map(p=>p[1]),...B.map(p=>p[1]))*1.15;
 const X=x=>(8+x/Dx*304).toFixed(1),Y=y=>(88-y/Hy*78).toFixed(1),line=pts=>pts.map((p,i)=>(i?'L':'M')+X(p[0])+' '+Y(p[1])).join(' ');
 const nextPlace=PLACE_AT.findIndex(a=>a>S.best),np=nextPlace>=0&&PLACE_AT[nextPlace]<Dx?`<line x1="${X(PLACE_AT[nextPlace])}" y1="10" x2="${X(PLACE_AT[nextPlace])}" y2="88" stroke="#c9b46a" stroke-width="2"/><text x="${(+X(PLACE_AT[nextPlace])+4).toFixed(1)}" y="20" font-size="10" fill="#4a4038">${placeName(nextPlace)}</text>`:'';
 const label=cmp?t('planes.previewLabel',{current:t('model.'+cur.id),other:t('model.'+m.id)}):t('model.'+m.id);
 const chart=`<svg class="chart" viewBox="0 0 320 96" role="img" aria-label="${label}">${np}<line x1="8" y1="88" x2="312" y2="88" stroke="#cbbfa8"/>`+
  (cmp?`<path d="${line(A)}" fill="none" stroke="var(--wk-path-now)" stroke-width="1.5" stroke-dasharray="5 4"/>`:'')+
  `<path id="newpath" d="${line(B)}" fill="none" stroke="var(--wk-path-new)" stroke-width="2.6"/><g id="mini"><polygon points="-6,-3 6,0 -6,3 -3,0" fill="#fff" stroke="#2a2622" stroke-width="1.2"/></g></svg>`;
 const legend=cmp?`<div class="legend" aria-hidden="true"><span>${t('model.'+cur.id)}</span><span class="new">${t('model.'+m.id)}</span></div>`:'';
 const estTxt=cmp?t('planes.estimate',{now:mtr(est(cur)),after:mtr(est(m))}):t('planes.estimateOwn',{now:mtr(est(m))});
 html+=`<div class="detail-grid"><div>${stats}</div><div>${chart}${legend}<p class="est num">${estTxt}</p><p class="note">${t('planes.estimateNote')}</p><p class="note">${t('planes.shared')}</p></div></div>`;
 d.innerHTML=html;p.append(d);
 flyMini(B,X,Y);
}
let flyRaf=0;
function flyMini(pts,X,Y){cancelAnimationFrame(flyRaf);const g=document.getElementById('mini');if(!g)return;const place=f=>{const i=Math.min(39,Math.floor(f*40)),a=pts[i],b=pts[i+1],k=f*40-i;const x=+X(a[0]+(b[0]-a[0])*k),y=+Y(a[1]+(b[1]-a[1])*k);const ang=Math.atan2(+Y(b[1])-+Y(a[1]),+X(b[0])-+X(a[0]))*180/Math.PI;g.setAttribute('transform',`translate(${x} ${y}) rotate(${ang.toFixed(1)})`);};
 if(reduced()){place(.999);return;}const t0=performance.now();const step=now=>{const f=Math.min(1,(now-t0)/600),e=1-(1-f)**3;place(Math.min(.999,e));if(f<1)flyRaf=requestAnimationFrame(step);};flyRaf=requestAnimationFrame(step);}
function roving(e,list){const btns=[...list.querySelectorAll('.card')],i=btns.indexOf(e.currentTarget);let j=null;
 if(e.key==='ArrowRight'||e.key==='ArrowDown')j=Math.min(btns.length-1,i+1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')j=Math.max(0,i-1);if(e.key==='Home')j=0;if(e.key==='End')j=btns.length-1;
 if(j!==null){e.preventDefault();btns[j].click();}}
function howText(h){switch(h.type){case 'place':return t('looks.howPlace',{place:placeName(h.place)});case 'district':return t('looks.howDistrict',{district:t('district.'+h.d)});
 case 'route':return t('looks.howRoute');case 'perfect':return t('looks.howPerfect',{event:t('event.'+h.event)});case 'plane':return t('looks.howPlane',{plane:t('model.'+h.plane)});case 'distance':return t('looks.howDistance',{distance:mtr(h.v)});}return '';}
function lookOrder(){const open=LOOKS.filter(lookOpen),locked=LOOKS.filter(l=>!lookOpen(l));
 const cur=open.filter(l=>l.id===S.look),others=open.filter(l=>l.id!==S.look).reverse();return cur.concat(others,locked);}
function renderLooks(p){
 let top=`<p class="note">${t('looks.note')}</p>`;
 if(S.retro){top=`<p class="retro" role="status">${t('looks.retro',{count:S.retro})}</p>`+top;S.retro=0;}
 if(opt.counter)top+=`<p class="counter num">${LOOKS.filter(lookOpen).length} / ${LOOKS.length}</p>`;
 p.insertAdjacentHTML('beforeend',top);
 const ul=document.createElement('ul');ul.className='swatches';ul.setAttribute('aria-label',t('looks.listLabel'));
 const m=M(S.inHand);
 for(const l of lookOrder()){const li=document.createElement('li'),b=document.createElement('button'),open=lookOpen(l),isNew=open&&l.id!=='plain'&&!S.seen.includes(l.id);
  b.type='button';b.className='card'+(l.id===S.look?' held':'');b.setAttribute('aria-pressed',l.id===pickL);b.tabIndex=l.id===pickL?0:-1;
  const name=t('look.'+l.id);
  b.innerHTML=`<svg viewBox="0 0 120 50" aria-hidden="true">${planeSVG(m.shape,l.acc,{sketch:!open,w:120,h:50,sc:44})}</svg><span class="nm">${name}${isNew?`<span class="tag-new" aria-hidden="true">${t('workshop.newTag')}</span>`:''}</span>`+
   (l.id===S.look?`<span class="st">✓ ${t('looks.wearing')}</span>`:open?'':`<span class="st">${lock}</span>`);
  b.setAttribute('aria-label',open?name+(l.id===S.look?', '+t('looks.wearing'):'')+(isNew?', '+t('workshop.newTag'):''):t('looks.lockedAria',{name,how:howText(l.how)}));
  b.onclick=()=>{pickL=l.id;render();$('panel').querySelector('.card[aria-pressed=true]')?.focus();};
  b.onkeydown=e=>roving(e,ul);li.append(b);ul.append(li);}
 p.append(ul);
 const l=L(pickL),open=lookOpen(l),d=document.createElement('div');d.className='detail';d.setAttribute('aria-live','polite');
 d.innerHTML=`<h2><span>${t('look.'+l.id)}</span>${open?'':lock}</h2><p>${t('look.'+l.id+'.desc')}</p>`+(open?`<p class="note">${t('looks.fitsAll')}</p>`:`<p class="locked-how">${t('looks.how',{how:howText(l.how)})}</p>`);
 p.append(d);
}
function renderUpgrades(p){
 const lv=S.lv,br=[['power',Math.min(3,Math.ceil(lv/4))],['paper',lv],['folds',Math.min(3,Math.floor(lv/4))]];
 let h=S.coins===0?`<p class="note">${t('workshop.empty')}</p>`:'';
 h+=`<p class="note">${t('upg.stub')}</p>`;
 for(const [b,n] of br){h+=`<div class="branch"><strong>${t('upg.'+b)}</strong>`;const max=b==='paper'?12:3;for(let i=1;i<=Math.min(max,6);i++)h+=`<span class="node${i<=n?' own':''}" aria-hidden="true">${i<=n?'✓':i}</span>`;h+='</div>';}
 p.insertAdjacentHTML('beforeend',h);
}
function renderAction(){
 const a=$('action');a.innerHTML='';let main=null,why='';
 const throwBtn=document.createElement('button');throwBtn.type='button';throwBtn.className='btn';throwBtn.textContent=t('workshop.launch');throwBtn.onclick=()=>live('(maketa) '+(lang==='cs'?'Tady by začal hod.':'A throw would start here.'));
 if(tab==='planes'){const v=visibleModels().find(x=>x.m.id===pickM),m=v.m;
  if(v.vis==='full'&&m.id!==S.inHand&&owns(m)){main=mk(t('planes.use'),()=>use(m.id));}
  else if(v.vis==='full'&&!owns(m)&&m.unlock.type==='coins'){const pr=m.unlock.price,short=S.coins<pr;main=mk(t('planes.buy',{price:num(pr)}),()=>{if(!short)askBuy(m);});
   if(short){main.setAttribute('aria-disabled','true');why=t('detail.missing',{count:pr-S.coins});main.setAttribute('aria-describedby','why');}}
 }else if(tab==='looks'){const l=L(pickL);if(lookOpen(l)&&l.id!==S.look)main=mk(t('looks.wear'),()=>wear(l.id));}
 if(why)a.insertAdjacentHTML('beforeend',`<p class="why num" id="why">${why}</p>`);
 if(main){main.classList.add('primary');a.append(main);a.append(throwBtn);}else{throwBtn.classList.add('primary');a.append(throwBtn);}
}
function mk(text,fn){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=text;b.onclick=fn;return b;}
function refold(quick){if(reduced())return;const pv=$('preview');pv.classList.remove('refold','refold-quick');void pv.offsetWidth;pv.classList.add(quick?'refold-quick':'refold');}
function use(id){S.inHand=id;pickM=id;render();refold(true);live(t('planes.inHandDone',{name:t('model.'+id)}));$('action').querySelector('.btn.primary')?.focus();}
function wear(id){S.look=id;pickL=id;render();refold(true);live(t('looks.woreDone',{name:t('look.'+id)}));$('action').querySelector('.btn.primary')?.focus();}
let buying=null;
function askBuy(m){if(!opt.confirm){doBuy(m);return;}buying=m;const pr=m.unlock.price;
 $('buy-title').textContent=t('buy.title',{name:t('model.'+m.id)});$('buy-coins').textContent=t('buy.coins',{now:num(S.coins),after:num(S.coins-pr)});
 $('buy-ok').textContent=t('buy.confirm',{price:num(pr)});$('buy-no').textContent=t('buy.cancel');$('buy-err').innerHTML='';
 $('buy').showModal();$('buy-no').focus();}
$('buy-no').onclick=()=>$('buy').close();
$('buy').addEventListener('close',()=>{if(buying){buying=null;$('action').querySelector('.btn.primary')?.focus();}});
$('buy-ok').onclick=()=>{const m=buying;if(!m)return;if(opt.fail||$('p-fail').value==='1'){$('buy-err').innerHTML=`<span class="err"><span aria-hidden="true">⚠</span>${t('buy.failed')}</span>`;return;}buying=null;$('buy').close();doBuy(m);};
function doBuy(m){if(S.bought.includes(m.id)||S.coins<m.unlock.price)return;const from=S.coins;S.coins-=m.unlock.price;S.bought.push(m.id);
 if(opt.autouse)S.inHand=m.id;pickM=m.id;render();countCoins(from,S.coins);refold(false);
 live(opt.autouse?t('planes.inHandDone',{name:t('model.'+m.id)}):t('model.'+m.id)+' ✓');$('action').querySelector('.btn.primary')?.focus();}
function countCoins(a,b){if(reduced()){wallet(b);return;}const t0=performance.now();const step=now=>{const f=Math.min(1,(now-t0)/300);wallet(Math.round(a+(b-a)*f));if(f<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

/* ---------- výsledek s novinkou (§7) ---------- */
const PRIO={place:1,paper:2,plane:3,shop:4,look:5};
function showResult(){
 const news=[...S.news].sort((a,b)=>PRIO[a.type]-PRIO[b.type]);
 $('res-dist').textContent=mtr(S.best);$('res-coins').textContent=t('result.coinsLabel',{count:Math.round(10+S.best/10)});
 const box=$('res-news');box.innerHTML='';
 if(news.length){const n=news[0];let label,art,act=null;
  if(n.type==='look'){const l=L(n.id);label=t('result.newLook',{name:t('look.'+n.id)});art=planeSVG(M(S.inHand).shape,l.acc,{w:40,h:40,sc:30});act=S.look===n.id?null:'wear';}
  else if(n.type==='plane'){const m=M(n.id);label=t('result.newPlane',{name:t('model.'+n.id)});art=planeSVG(m.shape,{}, {w:40,h:40,sc:30});act=S.inHand===n.id?null:'use';}
  else{const m=M(n.id);label=t('result.planeInShop',{name:t('model.'+n.id)});art=planeSVG(m.shape,{},{w:40,h:40,sc:30});}
  const row=document.createElement('div');row.className='news'+(reduced()?'':' drop');
  row.innerHTML=`<svg viewBox="0 0 40 40" aria-hidden="true">${art}</svg>`;
  const tb=document.createElement('button');tb.type='button';tb.className='t';tb.textContent=label;
  tb.onclick=()=>{$('result').close();tab=n.type==='look'?'looks':'planes';if(n.type==='look')pickL=n.id;else pickM=n.id;render(true);};
  row.append(tb);
  if(act){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=act==='wear'?t('result.wear'):t('result.useIt');
   b.onclick=()=>{if(act==='wear'){S.look=n.id;pickL=n.id;}else{S.inHand=n.id;pickM=n.id;}b.textContent=t('result.worn');b.setAttribute('aria-disabled','true');b.onclick=null;render();live(b.textContent);};row.append(b);}
  box.append(row);
  if(news.length>1)box.insertAdjacentHTML('beforeend',`<p class="more">${t('result.alsoNew',{count:news.length-1})}</p>`);
 }
 $('result').showModal();$('res-again').focus();
}
$('res-again').onclick=()=>$('result').close();
$('res-wk').onclick=()=>{$('result').close();tab='upgrades';render(true);};
$('res-atlas').onclick=()=>{$('result').close();live('(maketa) Atlas');};
$('close').onclick=()=>{markSeen();live('(maketa) '+(lang==='cs'?'Dílna by se zavřela.':'The Workshop would close.'));render();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open]'))$('close').click();});

/* ---------- panel makety ---------- */
const sel={scenario:'p-scenario',lang:'p-lang',reveal:'p-reveal',confirm:'p-confirm',autouse:'p-autouse',counter:'p-counter',motion:'p-motion'};
$('p-scenario').value=opt.scenario in SCEN?opt.scenario:'mid';$('p-lang').value=lang;$('p-reveal').value=opt.reveal;$('p-confirm').value=opt.confirm?'1':'0';$('p-autouse').value=opt.autouse?'1':'0';$('p-counter').value=opt.counter?'1':'0';$('p-motion').value=opt.motion;$('p-fail').value=opt.fail?'1':'0';
for(const [k,id] of Object.entries(sel))$(id).onchange=()=>{const u=new URLSearchParams(location.search);u.set(k,$(id).value);location.search=u.toString();};
$('p-result').onclick=showResult;
$('p-lost').onclick=()=>{lost=!lost;renderPreview();live(lost?t('status.glLost'):t('status.glBack'));};

render();
</script>
