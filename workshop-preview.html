<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Workshop preview (R3, dočasné)</title>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
<style>body{margin:0;background:#0b0820;color:#e8e6ff;font:13px monospace}#st{position:relative;width:1280px;height:720px}canvas{position:absolute;inset:0;width:1280px;height:720px}#ui{padding:8px}</style></head>
<body><div id="st"><canvas id="gl" width="1280" height="720"></canvas><canvas id="ov" width="1280" height="720"></canvas></div>
<div id="ui">charge <input id="charge" type="range" min="0" max="1" step=".01" value="0"> <label><input id="thrown" type="checkbox"> thrown</label> <label><input id="reduced" type="checkbox"> reduced</label> <span id="info"></span></div>
<script type="module">
import * as THREE from 'three';
import {createWorkshop} from './src/render3d/workshop.js';
import {kidPose,planePose,HAND,restCamera,REST} from './src/render3d/pose.js';
import {toonRamp,outlineMaterial,skyTexture} from './src/render3d/toon.js';
const $=id=>document.getElementById(id),gl=$('gl'),ov=$('ov').getContext('2d');
const r=new THREE.WebGLRenderer({canvas:gl,antialias:true});r.setSize(1280,720,false);r.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=skyTexture();scene.fog=new THREE.Fog('#4a1d63',400,1300);
const hemi=new THREE.HemisphereLight('#7f73ff','#2a1030',1.15),moon=new THREE.DirectionalLight('#ffe8ff',2.3),rim=new THREE.DirectionalLight('#ff4fc3',.9);
moon.position.set(HAND.x-120,260,180);moon.target.position.set(HAND.x-20,0,-10);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);Object.assign(moon.shadow.camera,{left:-120,right:120,top:120,bottom:-120,far:800});rim.position.set(.6,.3,-1);
scene.add(hemi,moon,moon.target,rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,700),new THREE.MeshToonMaterial({color:'#4b3778',gradientMap:toonRamp()}));ground.rotation.x=-Math.PI/2;ground.position.set(0,0,-290);ground.receiveShadow=true;scene.add(ground);
const hull=outlineMaterial({fog:{color:'#4a1d63',near:400,far:1300}}),ws=createWorkshop(scene,{hull});
for(const m of [hull,...ws.userData.outlines])m.uniforms.resolution.value.set(1280,720);
const c=restCamera(),cam=new THREE.PerspectiveCamera(c.fov,16/9,1,4000);cam.position.set(...c.position);cam.lookAt(...c.target);
let t=0,last=performance.now();
function frame(now){const dt=(now-last)/1000;last=now;t+=dt;const charge=+$('charge').value,thrown=$('thrown').checked,reduced=$('reduced').checked;
 ws.update(kidPose({charge,thrown,t,reduced}),thrown?null:planePose({charge,anim:reduced?0:t,clock:t,reduced}));r.render(scene,cam);
 const p=new THREE.Vector3(HAND.x,HAND.y,HAND.z).project(cam),sx=(p.x+1)*320,sy=(1-p.y)*180;
 ov.clearRect(0,0,1280,720);ov.strokeStyle='#ffef5a';ov.lineWidth=1;ov.beginPath();ov.arc(296,516,10,0,7);ov.moveTo(276,516);ov.lineTo(316,516);ov.moveTo(296,496);ov.lineTo(296,536);ov.stroke();
 $('info').textContent=`HAND → ${sx.toFixed(2)}, ${sy.toFixed(2)} (cíl 148, 258) · k ${REST.k} · draw calls ${r.info.render.calls}`;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
