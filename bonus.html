<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9c4a0"><meta name="color-scheme" content="light"><meta http-equiv="refresh" content="0; url=./#atlas"><title data-i18n="bonus.title">Atlas — Just Throw It</title><link rel="stylesheet" href="style.css"></head><body><p class="redirect"><a href="./#atlas" data-i18n="bonus.back">← Back to the planes</a></p>
<script type="module">
// The Atlas is a panel of the game now (02-ux §1.1): this page only forwards to ./#atlas, keeping ?lang= and other parameters.
import {t,setLang,pickLang,LANG_KEY} from './src/i18n.js';
let stored=null;try{stored=localStorage.getItem(LANG_KEY);}catch{}
document.documentElement.lang=setLang(pickLang(new URLSearchParams(location.search).get('lang'),stored));
for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=t(el.dataset.i18n);
location.replace('./'+location.search+'#atlas');
</script></body></html>
